name: ResearchDB Phase 2

on:
  push:
    branches:
      - v4.0-batch-0-final-hardgates-scope-lock
  workflow_dispatch:

jobs:
  researchdb-phase2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Compile
        run: python -m compileall zmatrix tests scripts

      - name: ResearchDB Phase 1.1
        run: bash scripts/verify_research_db_phase1_1_cloud_acceptance.sh

      - name: ResearchDB Phase 2
        run: bash scripts/verify_research_db_phase2_master_data.sh

      - name: Master Data Tests
        run: PYTHONPATH=. python -m pytest -q tests/research_db/master_data/
