name: V40 RC1 Readiness Audit
on:
  push:
    branches:
      - v4.0-batch-0-final-hardgates-scope-lock
  workflow_dispatch:
jobs:
  rc1-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
      - name: Compile
        run: python -m compileall zmatrix tests scripts
      - name: Hardening-B
        run: bash scripts/verify_v40_hardening_b.sh
      - name: Hardening-C2
        run: bash scripts/verify_v40_hardening_c2_all.sh
      - name: Hardening-C3
        run: bash scripts/verify_v40_hardening_c3_all.sh
      - name: Full tests
        run: PYTHONPATH=. python -m pytest -q tests/
